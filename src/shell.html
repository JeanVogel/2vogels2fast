<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>2 Vogels 2 Fast · Bloodline Racing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@800&family=Racing+Sans+One&family=Saira+Condensed:wght@500;700;800&family=Saira:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: fliperama de garagem, noite de racha em família — anos 90 encontram Velozes e Furiosos
   IDEA: o painel de um carro tunado + a tela de seleção do Stunts
   PICTURE: a própria pista 3D rodando ao fundo, com carro em piloto automático
   COLOUR/TYPE: roxo-noite, laranja nitro, ciano neon; Racing Sans One no logo, Saira Condensed no painel
   LAYOUT: cartões translúcidos sobre o 3D; HUD nos cantos durante a corrida */
:root{--night:#0e0a1f;--panel:rgba(16,11,34,.78);--line:rgba(255,255,255,.12);--ink:#f4f1ff;--dim:#a99fc9;--nitro:#ff7a1a;--neon:#2be4ff;--pink:#ff2a6d;--ok:#3dff9a;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--night);color:var(--ink);font:16px/1.5 Saira,system-ui,sans-serif;overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.layer{position:fixed;inset:0;pointer-events:none}
.layer>*{pointer-events:auto}
#screen{display:flex;padding:24px;overflow:auto;background:radial-gradient(ellipse at 30% 40%,rgba(14,10,31,.15),rgba(14,10,31,.75))}
#screen.hidden{display:none}
.wrap{width:min(1100px,100%);display:grid;gap:18px;margin:auto}
.logo{font-family:Anton,'Racing Sans One',Impact,sans-serif;font-weight:400;font-size:clamp(44px,7.4vw,92px);line-height:1;margin:0;transform:skewX(-11deg);transform-origin:left bottom;letter-spacing:.5px;
 background:linear-gradient(180deg,#fff 0%,#e9edf3 38%,#8c95a3 50%,#2c323c 53%,#a7b0bd 70%,#f4f6f8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 3px 0 #0a0c12) drop-shadow(0 0 20px rgba(255,120,30,.45))}
.logo .n{font-size:1.18em;background:linear-gradient(180deg,#fff3c4 0%,#ffb13b 40%,#ff5a12 55%,#c22a05 75%,#ff9a3c 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-family:Montserrat,'Saira Condensed',sans-serif;font-weight:800;font-size:clamp(13px,1.7vw,19px);letter-spacing:.55em;color:var(--neon);text-shadow:0 0 14px rgba(43,228,255,.6);margin-top:4px}
[hidden]{display:none!important}
.btn.wa{background:#25d366;box-shadow:0 4px 0 #0d6b33,0 0 18px rgba(37,211,102,.3);color:#04230f;text-decoration:none;display:inline-flex;align-items:center}
.btn.wa:hover{filter:brightness(1.08)}
.spick.many{left:52%;right:2%;gap:1.2cqw;flex-wrap:wrap}.spick.many .stag{min-width:10cqw;padding:.6cqw 1cqw}.spick.many .stag b{font-size:2.6cqw}
.pinbox{position:absolute;inset:0;display:grid;place-items:center;background:rgba(3,4,10,.72);backdrop-filter:blur(3px);z-index:3}
.pinbox .card{width:min(420px,86%);text-align:center}
.pin{font:700 34px 'Saira Condensed',monospace;letter-spacing:.5em;text-align:center;width:180px;padding:8px 0 8px .5em;border-radius:10px;border:2px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink);margin:6px auto 0;display:block}
.pin:focus,.txt:focus{outline:none;border-color:var(--neon)}
.txt{font:600 18px Saira,system-ui,sans-serif;width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:rgba(0,0,0,.3);color:var(--ink);margin-top:4px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}.sw.on{border-color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.6)}
.rank{display:grid;gap:6px;margin:8px 0;text-align:left}
.rk{display:grid;grid-template-columns:40px 1fr auto auto;gap:10px;align-items:center;background:rgba(255,255,255,.04);border-radius:10px;padding:8px 12px}
.rk .pos{font:700 20px 'Saira Condensed';color:var(--dim)}.rk .w{font-weight:700}
.btn.sm{font-size:14px;padding:6px 12px;min-height:32px;box-shadow:none}
.logobtn{background:none;border:0;padding:0;cursor:pointer;display:block}
.logoimg{display:block;width:clamp(220px,30vw,400px);height:auto;filter:drop-shadow(0 6px 18px rgba(0,0,0,.6))}
.confirm{border:2px solid var(--nitro);background:rgba(255,122,26,.1);border-radius:12px;padding:14px 16px;margin:10px 0}
.confirm h3{color:var(--nitro);font-size:24px;margin:0 0 6px}.confirm p{margin:0 0 12px}
/* abertura: arte 16:9 inteira na tela, nomes clicáveis nos cantos de cima */
.splash{position:fixed;inset:0;background:#05060c;display:grid;place-items:center;z-index:5}
.art169{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;container-type:inline-size}
.art169 img{width:100%;height:100%;display:block}
.spick{position:absolute;left:56%;right:3%;top:39%;display:flex;justify-content:center;gap:2.2cqw}
.stag{min-width:13cqw;background:rgba(6,8,16,.62);border:.18cqw solid currentColor;cursor:pointer;color:#fff;font:800 1.05cqw Montserrat,sans-serif;letter-spacing:.32em;text-align:center;padding:.9cqw 1.6cqw;border-radius:1cqw;backdrop-filter:blur(4px);transition:transform .15s,background .15s}
.stag span{color:#fff}
.stag b{display:block;font:400 3.6cqw/1.05 Anton,Impact,sans-serif;letter-spacing:.03em;transform:skewX(-10deg)}
.stag i{display:block;font:700 .85cqw Montserrat,sans-serif;font-style:normal;letter-spacing:.16em;color:#fff;opacity:.75;margin-top:.3cqw;text-transform:uppercase}
.stag.pai{color:var(--nitro)}.stag.filho{color:var(--neon)}
.stag.pai b{text-shadow:0 0 24px rgba(255,122,26,.6)}.stag.filho b{text-shadow:0 0 24px rgba(43,228,255,.6)}
.stag:hover,.stag:focus-visible{transform:scale(1.06);background:rgba(20,24,40,.8);outline:none}
.stag.last i{opacity:1;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;backdrop-filter:blur(8px)}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
@media(max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
h2{font-family:'Saira Condensed';font-weight:800;font-size:28px;line-height:1.05;margin:0 0 12px}
h3{font-family:'Saira Condensed';font-weight:700;font-size:20px;margin:0 0 6px;color:var(--dim)}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:10px}
.score .n{font-family:'Saira Condensed';font-weight:800;font-size:clamp(56px,9vw,92px);line-height:1}
.score .who{font-family:'Saira Condensed';font-weight:700;font-size:22px;color:var(--dim)}
.score .x{font-family:'Racing Sans One';font-size:40px;color:var(--nitro)}
.pai{color:var(--nitro)}.filho{color:var(--neon)}
.muted{color:var(--dim);font-size:14px}
.btn{font:700 18px 'Saira Condensed';letter-spacing:.3px;border:0;border-radius:10px;padding:12px 20px;min-height:46px;cursor:pointer;color:#1a0b00;background:linear-gradient(180deg,#ffb36b,#ff7a1a);box-shadow:0 4px 0 #8a3500,0 0 18px rgba(255,122,26,.35);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #8a3500}
.btn:focus-visible,.tog button:focus-visible,.carc:focus-visible{outline:3px solid var(--neon);outline-offset:2px}
.btn.alt{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.cy{background:linear-gradient(180deg,#8ff2ff,#2be4ff);color:#00222b;box-shadow:0 4px 0 #006b80,0 0 18px rgba(43,228,255,.35)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tog{display:inline-flex;background:rgba(255,255,255,.06);border-radius:10px;padding:4px;gap:4px}
.tog button{font:700 17px 'Saira Condensed';border:0;border-radius:8px;padding:8px 18px;min-height:40px;background:transparent;color:var(--dim);cursor:pointer}
.tog button.on.p{background:var(--nitro);color:#1a0b00}.tog button.on.f{background:var(--neon);color:#00222b}
.state{border-left:4px solid var(--nitro);padding:4px 0 4px 14px;margin:6px 0 14px}
.state.cy{border-color:var(--neon)}
.big{font-family:'Saira Condensed';font-weight:800;font-size:24px;line-height:1.15}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.carc{background:rgba(255,255,255,.04);border:2px solid transparent;border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.carc.on{border-color:var(--nitro);background:rgba(255,122,26,.12)}
.carc svg{width:100%;height:62px;display:block}
.carc{display:flex;flex-direction:column}
.carc .brand{font:700 12px Montserrat,'Saira Condensed',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-top:6px;line-height:16px}
.carc b{font-family:'Saira Condensed';font-size:20px;display:block;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carc b.long{font-size:16px;letter-spacing:-.2px}
.carc .meta{display:block;font-size:13px;line-height:18px;white-space:nowrap}
.bars{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:12px;color:var(--dim);margin-top:6px;align-items:center}
.bar{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--nitro),#ffd23f)}
.mapbox{position:relative;aspect-ratio:4/3;background:rgba(0,0,0,.35);border-radius:12px;overflow:hidden}
.mapbox canvas{position:absolute;inset:0;width:100%;height:100%}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.stat{background:rgba(255,255,255,.05);border-radius:10px;padding:8px 12px}
.stat b{display:block;font-family:'Saira Condensed';font-size:26px;line-height:1.1}
.warn{color:#ffd23f;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--dim);font-weight:600;font-size:13px}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
kbd{font:700 14px 'Saira Condensed';background:rgba(255,255,255,.1);border-radius:6px;padding:2px 8px;border:1px solid var(--line)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center}
/* HUD */
#hud.hidden{display:none}
#hud{font-family:'Saira Condensed';text-shadow:0 2px 6px rgba(0,0,0,.6)}
.hud-tc{position:absolute;top:14px;left:50%;transform:translateX(-50%);text-align:center}
#hTime{font-weight:800;font-size:clamp(34px,5vw,54px);line-height:1;font-variant-numeric:tabular-nums}
#hTarget{font-size:18px;color:var(--dim)}
#hHits{font-weight:700;font-size:20px;color:var(--dim);transition:transform .15s}
#hHits.on{color:var(--pink)}#hHits.pop{transform:scale(1.25)}
#hDelta{font-weight:800;font-size:24px;height:28px}
.hud-tl{position:absolute;top:14px;left:16px;font-size:18px;line-height:1.2}
.hud-tl b{font-size:22px}
.hud-tr{position:absolute;top:14px;right:16px;font-size:14px;color:var(--dim);text-align:right}
.hud-br{position:absolute;right:18px;bottom:16px;width:230px;text-align:right}
#hSpeed{font-weight:800;font-size:64px;line-height:.9;font-variant-numeric:tabular-nums}
.unit{font-size:18px;color:var(--dim)}
#hGear{display:inline-block;font-weight:800;font-size:26px;width:38px;height:38px;line-height:38px;text-align:center;border-radius:8px;background:rgba(0,0,0,.45);margin-left:8px;vertical-align:top}
.rpm{height:10px;border-radius:5px;background:rgba(0,0,0,.45);overflow:hidden;margin:8px 0 6px}
#hRpm{height:100%;width:0;background:linear-gradient(90deg,#2be4ff,#ffd23f 70%,#ff2a6d)}
.nos{display:flex;align-items:center;gap:8px;justify-content:flex-end;font-weight:800;font-size:16px;color:var(--neon)}
.nosbar{width:150px;height:12px;border-radius:6px;background:rgba(0,0,0,.45);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(43,228,255,.4)}
#hNos{height:100%;width:100%;background:linear-gradient(90deg,#2be4ff,#a2f6ff)}
.hud-bl{position:absolute;left:16px;bottom:16px;width:min(240px,32vw);aspect-ratio:1;background:rgba(10,6,24,.55);border-radius:12px;border:1px solid var(--line)}
.hud-bl canvas{width:100%;height:100%;display:block}
#hMsg{position:absolute;top:38%;left:0;right:0;text-align:center;font-family:'Racing Sans One';font-size:clamp(48px,9vw,110px);line-height:1;pointer-events:none;opacity:0;transition:opacity .2s}
#hSmall{position:absolute;top:56%;left:0;right:0;text-align:center;font-weight:800;font-size:26px;color:var(--neon);pointer-events:none}
#nosfx{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(ellipse at center,transparent 45%,rgba(43,228,255,.22) 80%,rgba(43,228,255,.4))}
#pause{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,5,20,.7)}
#pause.on{display:flex}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:15px;display:none;z-index:9}
@media(max-width:700px){.hud-bl{width:120px}.hud-br{width:170px}#hSpeed{font-size:44px}.nosbar{width:100px}.hud-tr{display:none}}
/* celular */
#tc,#rotate{display:none}
#pause{pointer-events:auto}
body.touch{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body.touch.racing{touch-action:none}
body.touch #tc{display:block;position:absolute;inset:0;pointer-events:none}
#tc button{pointer-events:auto;touch-action:none;border:2px solid rgba(255,255,255,.22);background:rgba(10,8,26,.38);color:rgba(255,255,255,.9);font:800 15px 'Saira Condensed',sans-serif;border-radius:18px;backdrop-filter:blur(2px);-webkit-user-select:none;user-select:none;padding:0}
#tc button.on{background:rgba(255,122,26,.55);border-color:#ffb36b;transform:scale(.97)}
.tcl{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:12px}
.tcl button{width:min(19vh,110px);height:min(30vh,150px);font-size:34px!important}
body.tilt .tcl{display:none}
.tcr{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:10px;align-items:end}
.tcr .gas{grid-column:2;grid-row:1/3;width:min(22vh,120px);height:min(46vh,240px);background:rgba(61,255,154,.22)!important;border-color:rgba(61,255,154,.6)!important;font-size:16px!important}
.tcr .brk{grid-column:1;grid-row:2;width:min(22vh,120px);height:min(24vh,120px);background:rgba(255,42,109,.22)!important;border-color:rgba(255,42,109,.55)!important}
.tcr .nos2{grid-column:1;grid-row:1;width:min(22vh,120px);height:min(12vh,58px);color:var(--neon)!important;border-color:rgba(43,228,255,.6)!important;display:none}
.tcr .hand{position:absolute;right:calc(100% + 10px);bottom:0;width:min(16vh,84px);height:min(16vh,84px);font-size:12px!important;line-height:1.1}
.tcr{grid-template-rows:auto auto}
body.touch .tcr .nos2{display:block}
.tct{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:flex;gap:8px}
.tct button{width:46px;height:46px;font-size:18px!important;border-radius:12px!important}
body.touch .hud-tr{display:none}
body.touch .hud-bl{left:auto;bottom:auto;top:62px;right:max(10px,env(safe-area-inset-right));width:min(22vh,120px)}
body.touch .hud-br{right:auto;left:50%;transform:translateX(-50%);bottom:8px;width:200px;text-align:center}
body.touch #hSpeed{font-size:40px}body.touch .nos{justify-content:center}body.touch .nosbar{width:110px}
body.touch .hud-tl{font-size:14px}body.touch .hud-tl b{font-size:17px}
body.touch #hTime{font-size:34px}body.touch #hTarget{font-size:14px}body.touch #hHits{font-size:15px}body.touch #hDelta{font-size:18px}
@media (orientation:portrait){body.touch.racing #rotate{display:flex}}
#rotate{position:fixed;inset:0;z-index:20;background:#05060c;color:var(--ink);flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;font-family:'Saira Condensed'}
#rotate div{font-size:72px;color:var(--nitro);animation:spin 2s ease-in-out infinite}#rotate b{font-size:30px}#rotate span{color:var(--dim)}
@keyframes spin{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
/* telas baixas (celular deitado) */
@media (max-height:520px){#screen{padding:10px}.logoimg{width:150px}.wrap{gap:10px}.card{padding:12px}h2{font-size:22px}.btn{min-height:40px;padding:8px 14px;font-size:16px}
 .score .n{font-size:44px}.stats{gap:6px}.stat b{font-size:20px}.mapbox{max-height:52vh}.carc svg{height:44px}.cars{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
@media (prefers-reduced-motion: reduce){.btn{transition:none}#hMsg{transition:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud" class="layer hidden">
  <div class="hud-tl" id="hWho"></div>
  <div class="hud-tc"><div id="hTime">0:00.00</div><div id="hHits">Batidas: 0</div><div id="hTarget"></div><div id="hDelta"></div></div>
  <div class="hud-tr"><kbd>C</kbd> câmera · <kbd>R</kbd> checkpoint · <kbd>Esc</kbd> pausa · <kbd>M</kbd> som</div>
  <div class="hud-bl"><canvas id="mini" width="480" height="480"></canvas></div>
  <div class="hud-br">
    <div><span id="hSpeed">0</span><span id="hGear">N</span></div>
    <div class="unit">km/h</div>
    <div class="rpm"><div id="hRpm"></div></div>
    <div class="nos">NOS <div class="nosbar"><div id="hNos"></div></div></div>
  </div>
  <div id="tc" aria-label="Controles de toque">
    <div class="tcl"><button data-k="left" aria-label="Virar à esquerda">◀</button><button data-k="right" aria-label="Virar à direita">▶</button></div>
    <div class="tcr"><button data-k="nitro" class="nos2" aria-label="Nitro">NOS</button><button data-k="hand" class="hand" aria-label="Freio de mão">FREIO<br>DE MÃO</button>
      <button data-k="brake" class="brk" aria-label="Frear e ré">FREIO</button><button data-k="gas" class="gas" aria-label="Acelerar">ACELERAR</button></div>
    <div class="tct"><button data-a="cam" aria-label="Câmera">🎥</button><button data-a="reset" aria-label="Voltar ao checkpoint">↺</button><button data-a="pause" aria-label="Pausa">❚❚</button></div>
  </div>
  <div id="rotate"><div>↻</div><b>Gire o celular</b><span>O jogo é na horizontal</span></div>
  <div id="nosfx"></div>
  <div id="hMsg"></div><div id="hSmall"></div>
  <div id="pause"><div class="card" style="max-width:420px;text-align:center"><img src="logo.webp" alt="2 Vogels 2 Fast" style="width:220px;max-width:70%;margin:-6px auto 4px;display:block"><h2>Pausa</h2><p class="muted" id="pauseInfo"></p><div class="row" style="justify-content:center" id="pauseBtns"></div></div></div>
</div>
<div id="screen" class="layer"></div>
<div id="toast"></div>
<script type="module">
/*__CODE__*/
</script>
</body>
</html>
